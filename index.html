

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Literature Club | Acceptance</title>

    <!-- PyScript -->
    <link rel="stylesheet"
        href="https://pyscript.net/releases/2026.7.3/core.css">

    <script type="module"
        src="https://pyscript.net/releases/2026.7.3/core.js">
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet">

    <style>
        /* =========================
           GLOBAL STYLES
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --white: #ffffff;
            --silver: #e8eaf0;
            --line: #c7cbd8;
            --ink: #191c25;
            --muted: #7d8497;
            --accent: #9eaccb;
            --pale-blue: #eef1f8;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 35px 18px;
            position: relative;
            overflow-x: hidden;

            background:
                radial-gradient(
                    ellipse at top,
                    #ffffff 0%,
                    transparent 65%
                ),
                linear-gradient(
                    135deg,
                    #f1f2f7,
                    #ffffff 50%,
                    #e7eaf2
                );

            color: var(--ink);
            font-family: 'DM Mono', monospace;
        }

        /* Futuristic grid background */

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(
                    rgba(170, 179, 197, 0.3) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(170, 179, 197, 0.3) 1px,
                    transparent 1px
                );
            background-size: 48px 48px;
            opacity: 0.25;
            pointer-events: none;
            z-index: -1;
        }

        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            width: 100%;
            max-width: 650px;
            padding: 45px;
            position: relative;
            z-index: 1;

            background: rgba(255, 255, 255, 0.91);
            border: 1px solid var(--line);

            box-shadow:
                0 0 0 6px rgba(255, 255, 255, 0.7),
                0 20px 60px rgba(35, 42, 63, 0.10);

            animation: appear 0.8s ease both;
        }

        /* Angular cyber corners */

        .container::before,
        .container::after {
            content: "";
            position: absolute;
            width: 35px;
            height: 35px;
            border-color: var(--ink);
            border-style: solid;
            pointer-events: none;
        }

        .container::before {
            top: -5px;
            left: -5px;
            border-width: 2px 0 0 2px;
        }

        .container::after {
            bottom: -5px;
            right: -5px;
            border-width: 0 2px 2px 0;
        }

        /* =========================
           TOP BAR
        ========================= */

        .topline {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--line);

            font-size: 10px;
            letter-spacing: 3px;
            color: var(--muted);
        }

        .club-label {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .club-label .symbol {
            color: var(--ink);
            font-size: 19px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background: #7189b7;
            border-radius: 50%;
            box-shadow: 0 0 10px #a9bce9;
            animation: pulse 2s infinite;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            text-align: center;
            padding: 38px 0 30px;
        }

        .eyebrow {
            margin-bottom: 15px;
            font-size: 10px;
            letter-spacing: 5px;
            color: var(--muted);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(40px, 8vw, 65px);
            font-weight: 600;
            line-height: 1.1;
            letter-spacing: -2px;
        }

        h1 span {
            color: #8997b6;
        }

        h4 {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 20px;

            font-size: 11px;
            letter-spacing: 5px;
            font-weight: 400;
        }

        h4::before,
        h4::after {
            content: "";
            width: 35px;
            height: 1px;
            background: var(--ink);
        }

        .description {
            max-width: 360px;
            margin: 0 auto;
            padding-top: 18px;

            font-size: 11px;
            line-height: 1.9;
            color: var(--muted);
            text-align: center;
        }

        /* =========================
           FORM PANEL
        ========================= */

        .form-area {
            border: 1px solid var(--line);
            padding: 28px;
            position: relative;

            background: linear-gradient(
                145deg,
                rgba(255, 255, 255, 0.98),
                rgba(245, 247, 252, 0.85)
            );
        }

        .form-area::before {
            content: "ENTRY FORM // 001";
            position: absolute;
            top: -8px;
            left: 20px;
            padding: 0 10px;
            background: white;

            color: var(--muted);
            font-size: 9px;
            letter-spacing: 2px;
        }

        .field {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 10px;

            font-size: 10px;
            letter-spacing: 3px;
            font-weight: 500;
        }

        label::before {
            content: "✦";
            margin-right: 10px;
            color: #8496bd;
        }

        /* =========================
           INPUT FIELDS
        ========================= */

        input {
            display: block;
            width: 100%;
            padding: 16px;

            background: rgba(255, 255, 255, 0.85);
            border: 1px solid var(--line);
            border-radius: 0;
            outline: none;

            font-family: 'DM Mono', monospace;
            font-size: 13px;
            color: var(--ink);

            transition: 0.3s ease;
        }

        input::placeholder {
            color: #a6adbd;
        }

        input:focus {
            border-color: #64799f;
            box-shadow: 0 0 0 3px rgba(142, 160, 196, 0.15);
            background: white;
        }

        /* =========================
           CHECK BUTTON
        ========================= */

        button {
            display: block;
            width: 100%;
            padding: 17px;
            margin-top: 2px;

            border: 1px solid var(--ink);
            background: var(--ink);
            color: white;

            font-family: 'DM Mono', monospace;
            font-size: 12px;
            letter-spacing: 5px;

            cursor: pointer;
            transition: 0.3s ease;
        }

        button::before {
            content: "✦";
            margin-right: 14px;
            color: #b9c7e5;
        }

        button::after {
            content: "✦";
            margin-left: 14px;
            color: #b9c7e5;
        }

        button:hover {
            background: white;
            color: var(--ink);
            box-shadow: 5px 5px 0 #cbd2e2;
            transform: translate(-2px, -2px);
        }

        button:active {
            transform: translate(0, 0);
            box-shadow: none;
        }

        button:focus-visible {
            outline: 2px solid #7189b7;
            outline-offset: 4px;
        }

        /* =========================
           PYTHON OUTPUT AREA
        ========================= */

        #output1 {
            min-height: 65px;
            margin-top: 22px;
            padding: 18px;

            border: 1px dashed var(--line);
            background: rgba(239, 242, 249, 0.5);

            color: var(--ink);
            font-size: 12px;
            line-height: 1.8;
            text-align: center;
            overflow-wrap: anywhere;

            transition: background 0.3s ease;
        }

        #output1:empty::before {
            content: "AWAITING YOUR ENTRY...";
            display: block;
            padding: 5px 0;

            color: var(--muted);
            font-size: 10px;
            letter-spacing: 2px;
        }

        #output1 ul {
            list-style-type: square;
        }

        #output1 li {
            padding-left: 3px;
        }

        #output1 summary:hover {
            color: #7189b7;
        }

        #output1 details[open] summary {
            margin-bottom: 10px;
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;

            margin-top: 25px;
            padding-top: 18px;
            border-top: 1px solid var(--line);

            color: var(--muted);
            font-size: 9px;
            letter-spacing: 2px;
        }

        .footer span:last-child {
            text-align: right;
        }

        .footer-symbol {
            color: #8997b6;
        }

        /* =========================
           ANIMATIONS
        ========================= */

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: 0.35;
            }
        }

        /* =========================
           RESPONSIVE DESIGN
        ========================= */

        @media (max-width: 480px) {
            body {
                padding: 22px 14px;
            }

            .container {
                padding: 24px 18px;
            }

            .form-area {
                padding: 24px 16px;
            }

            .topline {
                font-size: 8px;
                letter-spacing: 1.5px;
            }

            .status {
                gap: 5px;
            }

            .eyebrow {
                font-size: 9px;
                letter-spacing: 3px;
            }

            h4 {
                letter-spacing: 3px;
                font-size: 10px;
            }

            .footer {
                font-size: 8px;
                letter-spacing: 1px;
            }

            input {
                padding: 14px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <!-- MAIN LITERATURE CLUB CARD -->
    <div class="container">

        <!-- TOP BAR -->
        <div class="topline">

            <div class="club-label">
                <span class="symbol">✦</span>
                <span>LITERATURE CLUB</span>
            </div>

            <div class="status">
                <span class="status-dot"></span>
                <span>SYSTEM ONLINE</span>
            </div>

        </div>

        <!-- PAGE HEADER -->
        <header>

            <p class="eyebrow">
                A SANCTUARY FOR STORIES
            </p>

            <h1>
                Literature <span>Club</span>
            </h1>

            <h4>
                CLUB ACCEPTANCE
            </h4>

            <p class="description">
                Every book opens a new universe.
                Every reader carries a thousand worlds.
                Begin your next chapter with us.
            </p>

        </header>

        <!-- MEMBERSHIP FORM -->
        <main class="form-area">

            <div class="field">
                <label for="first_name">
                    FIRST NAME
                </label>

                <input
                    type="text"
                    id="first_name"
                    name="first_name"
                    placeholder="Enter first name"
                    autocomplete="given-name"
                    required
                >
            </div>

            <div class="field">
                <label for="last_name">
                    LAST NAME
                </label>

                <input
                    type="text"
                    id="last_name"
                    name="last_name"
                    placeholder="Enter last name"
                    autocomplete="family-name"
                    required
                >
            </div>

            <!-- Connected to check_membership() in main.py -->
            <button
                type="button"
                py-click="check_membership"
            >
                CHECK
            </button>

            <!-- Python-generated messages appear here -->
            <div id="output1" aria-live="polite">
                AWAITING YOUR ENTRY...
            </div>

        </main>

        <!-- FOOTER -->
        <footer class="footer">

            <span>
                READ<span class="footer-symbol">.</span>
                REFLECT<span class="footer-symbol">.</span>
                REIMAGINE<span class="footer-symbol">.</span>
            </span>

            <span>
                EST. MMXXVI // LC-001
            </span>

        </footer>

    </div>

    <!-- LOAD PYTHON FILE -->
    <script type="py" src="./main.py"></script>

</body>
</html>
